name: Pipeline diario

on:
  push:
    branches: [main]
    # Un commit de documentacion no justifica despertar el warehouse.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    # 09:00 UTC = 06:00 en Buenos Aires (UTC-3 todo el ano, sin horario de
    # verano), lunes a viernes. A esa hora el dia anterior ya cerro en Argentina
    # y la fecha UTC del runner coincide con la local.
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
    inputs:
      days:
        description: 'Backfill: cantidad de dias consecutivos a generar'
        required: false
        type: string
      until:
        description: 'Backfill: generar hasta esta fecha inclusive (YYYY-MM-DD)'
        required: false
        type: string

# Nunca dos corridas a la vez: las dos escribirian _state.json y RAW en
# paralelo, y la segunda partiria de un estado que la primera todavia no cerro.
concurrency:
  group: ap-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    name: generate -> normalize -> load -> dbt -> export
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Absoluta: los pasos de dbt corren con working-directory dbt_ap, y una
      # ruta relativa se resolveria como dbt_ap/dbt_ap.
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_ap
      # Todo llega como secret del repositorio, tambien los nombres de objetos.
      # Que un nombre de schema salga enmascarado en los logs no molesta, y un
      # unico origen evita que la mitad de la configuracion quede vacia.
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA_RAW: ${{ secrets.SNOWFLAKE_SCHEMA_RAW }}
      SNOWFLAKE_SCHEMA_ANALYTICS: ${{ secrets.SNOWFLAKE_SCHEMA_ANALYTICS }}
      SNOWFLAKE_STAGE: ${{ secrets.SNOWFLAKE_STAGE }}
      SNOWFLAKE_FILE_FORMAT: ${{ secrets.SNOWFLAKE_FILE_FORMAT }}
      SNOWFLAKE_RAW_TABLE: ${{ secrets.SNOWFLAKE_RAW_TABLE }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      # Modo CI de load.py y del target ci de dbt: el PEM completo en una
      # variable. SNOWFLAKE_PRIVATE_KEY_PATH no se define en el runner.
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

    steps:
      - uses: actions/checkout@v4
        with:
          # El publicador de artefactos crea ramas y worktrees: necesita el
          # historial completo, no un shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Restaurar el estado del generador
        # El repo versiona el estado inicial, del 2026-09-06. El estado vigente
        # lo publica cada corrida en la rama artifacts. Sin este paso, cada
        # ejecucion volveria a arrancar desde el dia uno del ledger.
        run: |
          set -euo pipefail
          if git fetch --depth=1 origin artifacts 2>/dev/null \
             && git cat-file -e FETCH_HEAD:state/_state.json 2>/dev/null; then
            git show FETCH_HEAD:state/_state.json > landing/_state.json
            echo "Estado restaurado de la rama artifacts."
          else
            echo "Sin estado publicado: se usa el estado inicial del repo."
          fi
          python -c "import json,pathlib; s=json.loads(pathlib.Path('landing/_state.json').read_text()); print('last_run_date:', s['last_run_date'], '| abiertas:', s['open_items'])"

      - name: Generar el change feed
        # Sin inputs, lleva el ledger desde last_run_date + 1 hasta AYER en hora
        # de Buenos Aires. El avance lo marca _state.json y no el calendario del
        # cron: el lunes cubre sabado y domingo, una segunda corrida el mismo dia
        # no genera nada, y ningun dia se saltea ni se repite. "Ayer en AR" nunca
        # es posterior a la fecha UTC del runner, asi que el generador no rechaza
        # el tope por fecha futura.
        env:
          INPUT_UNTIL: ${{ inputs.until }}
          INPUT_DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_UNTIL" ]; then
            python generate_extract.py --until "$INPUT_UNTIL"
          elif [ -n "$INPUT_DAYS" ]; then
            python generate_extract.py --days "$INPUT_DAYS"
          else
            LAST_RUN=$(python -c "import json,pathlib; print(json.loads(pathlib.Path('landing/_state.json').read_text())['last_run_date'])")
            TARGET=$(TZ=America/Argentina/Buenos_Aires date -d yesterday +%F)
            if [[ "$LAST_RUN" < "$TARGET" ]]; then
              python generate_extract.py --until "$TARGET"
            else
              echo "El ledger ya esta al $LAST_RUN (tope $TARGET): no hay dias que generar."
            fi
          fi

      - name: Normalizar y validar checksums
        # Sin argumentos procesa todos los extractos que todavia no tienen CSV,
        # en orden cronologico: un backfill de 60 dias entra en una invocacion.
        run: python normalize.py

      - name: Ingestar en RAW
        # Una sola conexion y un solo COPY para todos los archivos pendientes.
        # Cada resume del warehouse factura 60 segundos como minimo.
        run: python load.py

      - name: dbt deps
        working-directory: dbt_ap
        run: dbt deps

      - name: dbt build
        # build = seed + snapshot + run + test, en orden de dependencias y
        # cortando en el primer fallo. Los tests de invariantes y el de
        # reconciliacion contra RAW frenan la publicacion si algo no cuadra.
        working-directory: dbt_ap
        run: dbt build --target ci

      - name: Publicar estado y artefactos en la rama artifacts
        # Va inmediatamente despues de dbt build: RAW ya recibio los archivos de
        # esta corrida, y el estado tiene que quedar persistido aunque el export
        # falle despues.
        #
        # Este commit cumple tres funciones:
        #   1. Persiste _state.json para la corrida siguiente.
        #   2. Deja manifest.json para el Slim CI (--select state:modified+).
        #   3. Mantiene el repo activo: GitHub deshabilita los cron despues de
        #      60 dias sin actividad, y un pipeline que se apaga solo es peor
        #      que uno que nunca existio. Por eso no hay salida silenciosa: si
        #      no hay commit o el push no sale, el job termina en rojo.
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git fetch origin artifacts 2>/dev/null; then
            git branch -f artifacts FETCH_HEAD
          else
            # Primera corrida: rama huerfana sobre el arbol vacio.
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            git branch -f artifacts "$(git commit-tree "$EMPTY_TREE" -m 'artifacts: rama inicial')"
          fi

          WORKTREE="$RUNNER_TEMP/artifacts"
          git worktree add "$WORKTREE" artifacts

          install -D -m 644 landing/_state.json            "$WORKTREE/state/_state.json"
          install -D -m 644 dbt_ap/target/run_results.json "$WORKTREE/dbt/run_results.json"
          install -D -m 644 dbt_ap/target/manifest.json    "$WORKTREE/dbt/manifest.json"

          cd "$WORKTREE"
          git add -A
          if git diff --cached --quiet; then
            # run_results.json cambia en cada invocacion de dbt (invocation_id,
            # tiempos). Un arbol identico significa que no se esta publicando lo
            # que corrio.
            echo "::error::Nada que commitear en artifacts: el estado de esta corrida no se publico."
            exit 1
          fi

          LAST_RUN=$(python -c "import json,pathlib; print(json.loads(pathlib.Path('state/_state.json').read_text())['last_run_date'])")
          git commit -m "pipeline: ledger al $LAST_RUN (run ${{ github.run_number }})"
          if ! git push origin artifacts; then
            echo "::error::Fallo el push a artifacts. _state.json no quedo persistido y el repo no registra actividad."
            exit 1
          fi

      - name: Exportar los datasets del tablero
        run: python export_mart.py

      - name: Publicar los datasets del tablero
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/data
          if git diff --cached --quiet; then
            echo "Los datasets no cambiaron."
          else
            git commit -m "tablero: datasets al $(date -u +%Y-%m-%d) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Resultados de dbt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target-${{ github.run_number }}
          path: |
            dbt_ap/target/run_results.json
            dbt_ap/target/manifest.json
            dbt_ap/logs/dbt.log
          retention-days: 14
          if-no-files-found: warn
