name: Pipeline diario (Dagster)

# Reemplaza al pipeline.yml anterior: la orquestacion es Dagster y este
# workflow solo le da un runner y un horario. No conviven dos orquestaciones
# que carguen lo mismo.
#
# Cada corrida ejecuta el job fbl1n_daily (`dagster job execute`) sobre los
# dias pendientes: desde el siguiente al estado del generador hasta ayer
# en hora argentina. Si no hay pendientes, reprocesa ayer -- es idempotente, y
# deja verificado que lo sigue siendo.

on:
  schedule:
    # 09:00 UTC = 06:00 en Buenos Aires (UTC-3 todo el ano). Todos los dias:
    # las particiones son diarias.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      partition_start:
        description: 'Backfill: primera particion (YYYY-MM-DD). Vacio = pendientes'
        required: false
        type: string
      partition_end:
        description: 'Backfill: ultima particion (YYYY-MM-DD). Vacio = ayer'
        required: false
        type: string
      full_refresh:
        description: 'dbt build --full-refresh (una vez, al cambiar la clave de un incremental)'
        required: false
        type: boolean
        default: false

# Nunca dos corridas a la vez: las dos escribirian el estado del generador y
# RAW en paralelo.
concurrency:
  group: ap-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    name: dagster job execute fbl1n_daily (rango de particiones)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_ap
      DBT_TARGET: ci
      # Configuracion de Snowflake: todo por secrets del repositorio. La clave
      # privada NO va aca: la escribe a un archivo el paso siguiente.
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA_RAW: ${{ secrets.SNOWFLAKE_SCHEMA_RAW }}
      SNOWFLAKE_SCHEMA_ANALYTICS: ${{ secrets.SNOWFLAKE_SCHEMA_ANALYTICS }}
      SNOWFLAKE_STAGE: ${{ secrets.SNOWFLAKE_STAGE }}
      SNOWFLAKE_FILE_FORMAT: ${{ secrets.SNOWFLAKE_FILE_FORMAT }}
      SNOWFLAKE_RAW_TABLE: ${{ secrets.SNOWFLAKE_RAW_TABLE }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

    steps:
      - uses: actions/checkout@v4
        with:
          # El publicador de artefactos crea ramas y worktrees.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Escribir la clave privada a un archivo temporal
        # El secret llega solo a este paso. Se escribe con umask 077 (permisos
        # 600) en el directorio temporal del runner, y los pasos siguientes
        # reciben unicamente la ruta. Nunca se imprime: ni el valor ni su largo.
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/snowflake_key.p8"
          # El secret puede venir con los saltos de linea escapados.
          python -c 'import os, sys; open(sys.argv[1], "w").write(os.environ["SNOWFLAKE_PRIVATE_KEY"].replace("\\n", "\n").strip() + "\n")' "$key_file"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$key_file" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dagster_home"
          touch "$RUNNER_TEMP/dagster_home/dagster.yaml"
          echo "DAGSTER_HOME=$RUNNER_TEMP/dagster_home" >> "$GITHUB_ENV"

      - name: Restaurar estado y archivo de extractos
        # La rama artifacts guarda el estado del generador y todos los
        # extractos procesados. Con ellos, un backfill de cualquier dia
        # archivado reprocesa exactamente el mismo archivo.
        run: |
          set -euo pipefail
          if git fetch --depth=1 origin artifacts 2>/dev/null \
             && git cat-file -e FETCH_HEAD:state/_state.json 2>/dev/null; then
            git show FETCH_HEAD:state/_state.json > landing/_state.json
            restored=0
            for f in $(git ls-tree --name-only FETCH_HEAD extracts/ 2>/dev/null); do
              git show "FETCH_HEAD:$f" > "landing/$(basename "$f")"
              restored=$((restored + 1))
            done
            echo "Estado restaurado de artifacts, $restored extracto(s) archivados."
          else
            echo "Sin estado publicado: se usa el estado inicial del repo."
          fi

      - name: Actualizar cotizaciones del BCRA
        # La API del BCRA responde 403 a los runners de GitHub. No es fatal: si
        # el seed commiteado cubre los dias a generar, alcanza. Si no los
        # cubre, el asset fbl1n_extract corta con un mensaje que dice que hacer.
        run: |
          python scripts/update_fx_rates.py \
            || echo "::warning::La API del BCRA no respondio; se usa el seed de cotizaciones commiteado."

      - name: dbt deps + dbt parse
        # El manifest que lee @dbt_assets al cargar las Definitions.
        working-directory: dbt_ap
        run: |
          dbt deps
          dbt parse --target ci

      - name: Calcular el rango de particiones
        id: range
        env:
          INPUT_START: ${{ inputs.partition_start }}
          INPUT_END: ${{ inputs.partition_end }}
        run: |
          set -euo pipefail
          yesterday=$(TZ=America/Argentina/Buenos_Aires date -d yesterday +%F)
          last_run=$(python -c "import json, pathlib; print(json.loads(pathlib.Path('landing/_state.json').read_text())['last_run_date'])")
          next_day=$(date -d "$last_run + 1 day" +%F)
          end="${INPUT_END:-$yesterday}"
          if [ -n "$INPUT_START" ]; then
            start="$INPUT_START"
          elif [[ "$next_day" > "$end" ]]; then
            start="$end"   # nada pendiente: reprocesa el ultimo dia (idempotente)
          else
            start="$next_day"
          fi
          echo "Particiones: $start...$end (estado al $last_run)"
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo "end=$end" >> "$GITHUB_OUTPUT"

      - name: dagster job execute fbl1n_daily
        # El job tiene todo el grafo con sus checks. El rango va en los tags de
        # particion de Dagster: los assets usan BackfillPolicy.single_run, asi
        # que N dias son una sola corrida, un solo dbt build y una sola vez el
        # warehouse encendido.
        env:
          FULL_REFRESH: ${{ inputs.full_refresh }}
        run: |
          set -euo pipefail
          run_config="$RUNNER_TEMP/run_config.yaml"
          if [ "$FULL_REFRESH" = "true" ]; then
            printf 'ops:\n  ap_dbt_assets:\n    config:\n      full_refresh: true\n' > "$run_config"
          else
            printf '{}\n' > "$run_config"
          fi
          dagster job execute \
            -m orchestration.definitions \
            -j fbl1n_daily \
            -c "$run_config" \
            --tags '{"dagster/asset_partition_range_start": "${{ steps.range.outputs.start }}", "dagster/asset_partition_range_end": "${{ steps.range.outputs.end }}"}'

      - name: Publicar estado, extractos y artefactos de dbt en artifacts
        # Este commit persiste el estado para la corrida siguiente, archiva los
        # extractos para futuros backfills y mantiene activo el repo (GitHub
        # deshabilita los cron tras 60 dias sin actividad). Sin commit o sin
        # push, el job termina en rojo.
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git fetch origin artifacts 2>/dev/null; then
            git branch -f artifacts FETCH_HEAD
          else
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            git branch -f artifacts "$(git commit-tree "$EMPTY_TREE" -m 'artifacts: rama inicial')"
          fi

          WORKTREE="$RUNNER_TEMP/artifacts"
          git worktree add "$WORKTREE" artifacts

          install -D -m 644 landing/_state.json "$WORKTREE/state/_state.json"
          mkdir -p "$WORKTREE/extracts"
          cp landing/FBL1N_*.xlsx "$WORKTREE/extracts/"
          # dagster-dbt escribe cada invocacion en su propio subdirectorio de target/.
          results=$(ls -t $(find dbt_ap/target -name run_results.json) | head -1)
          install -D -m 644 "$results" "$WORKTREE/dbt/run_results.json"
          install -D -m 644 "$(dirname "$results")/manifest.json" "$WORKTREE/dbt/manifest.json"

          cd "$WORKTREE"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Nada que commitear en artifacts: el estado de esta corrida no se publico."
            exit 1
          fi
          LAST_RUN=$(python -c "import json,pathlib; print(json.loads(pathlib.Path('state/_state.json').read_text())['last_run_date'])")
          git commit -m "pipeline: ledger al $LAST_RUN (run ${{ github.run_number }})"
          if ! git push origin artifacts; then
            echo "::error::Fallo el push a artifacts. El estado no quedo persistido."
            exit 1
          fi

      - name: Exportar los datasets del tablero
        run: python export_mart.py

      - name: Publicar datasets y cotizaciones en main
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/data dbt_ap/seeds/fx_rates.csv
          if git diff --cached --quiet; then
            echo "Los datasets no cambiaron."
          else
            git commit -m "tablero: datasets y cotizaciones al $(date -u +%Y-%m-%d) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Borrar la clave privada
        if: always()
        run: rm -f "$RUNNER_TEMP/snowflake_key.p8"

      - name: Resultados de dbt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target-${{ github.run_number }}
          path: |
            dbt_ap/target/**/run_results.json
            dbt_ap/logs/dbt.log
          retention-days: 14
          if-no-files-found: warn
