name: CI

# Validacion estatica de cada PR, sin conexion a Snowflake: ruff, sqlfluff,
# dbt deps y dbt parse. No hay secrets en este workflow a proposito. Lo que
# necesita el warehouse -- compilar is_incremental(), correr modelos y tests --
# lo hace pipeline.yml en cada corrida contra datos reales.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint y parse
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Absoluta: los pasos de dbt corren con working-directory dbt_ap, y una
      # ruta relativa se resolveria como dbt_ap/dbt_ap.
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_ap
      # Valores de relleno, NO secretos. profiles.yml resuelve todo por env_var()
      # sin fallback, asi que dbt necesita que las variables existan para
      # renderizar el perfil -- pero `dbt parse` no abre ninguna conexion, y
      # estos nombres no dan acceso a nada.
      SNOWFLAKE_ACCOUNT: parse-only
      SNOWFLAKE_USER: parse-only
      SNOWFLAKE_ROLE: AP_PIPELINE
      SNOWFLAKE_WAREHOUSE: AP_WH
      SNOWFLAKE_DATABASE: AP_ANALYTICS
      SNOWFLAKE_SCHEMA_RAW: RAW
      SNOWFLAKE_SCHEMA_ANALYTICS: ANALYTICS
      SNOWFLAKE_PRIVATE_KEY_PATH: /dev/null

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: ruff
        run: ruff check .

      - name: sqlfluff
        # Templater jinja, no el de dbt: linteamos el SQL sin conexion y sin
        # resolver paquetes, para que un PR desde un fork tambien pase.
        run: sqlfluff lint dbt_ap/models dbt_ap/tests

      - name: dbt deps
        working-directory: dbt_ap
        run: dbt deps

      - name: dbt parse
        # Valida jinja, refs, sources, exposures y el YAML de tests, todo sin
        # tocar Snowflake. Es la barrera real de este workflow.
        #
        # dbt compile queda afuera a proposito: para resolver is_incremental()
        # le pregunta al warehouse si la relacion existe, y eso despertaria AP_WH
        # (60 segundos minimos de facturacion) en cada push a un PR.
        working-directory: dbt_ap
        run: dbt parse
