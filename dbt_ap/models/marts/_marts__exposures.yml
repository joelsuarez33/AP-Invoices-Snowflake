version: 2

exposures:
  - name: ap_dashboard
    label: Tablero de cuentas a pagar
    type: dashboard
    maturity: high
    url: https://ap-analytics.vercel.app
    description: >
      Tablero publico del ledger de acreedores, desplegado en Vercel. No
      consulta Snowflake: export_mart.py materializa los agregados a JSON
      estatico en web/public/data/ como ultimo paso del pipeline, y el sitio
      lee esos archivos. Es lo que mantiene el warehouse suspendido entre
      corridas -- el tablero no despierta el warehouse cada vez que alguien lo
      abre.

      Declarar la exposure hace que `dbt ls --select +exposure:ap_dashboard`
      devuelva todo lo que el tablero necesita, y que un cambio en cualquiera
      de esos modelos aparezca en el impacto del PR.

    depends_on:
      - ref('fct_ap_open_items')
      - ref('fct_ap_payment_performance')
      - ref('dim_vendor')
      - ref('dim_date')

    owner:
      name: Analytics Engineering
      email: joelsuarez3470@gmail.com
